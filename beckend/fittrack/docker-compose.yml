version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: fittrack_db
    environment:
      POSTGRES_USER: drack
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fittrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: